[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autobahn-perception-stack"
version = "0.2.0"
description = "APS++ - Autonomous Perception Stack for real-time driving scene understanding"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "rich>=13.0",
    "torch>=2.0",
    "ultralytics>=8.0",
    "deep-sort-realtime>=1.3",
    "supervision>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
    "hypothesis>=6.92",
    "ruff>=0.3",
    "mypy>=1.8",
]
onnx = [
    "onnxruntime>=1.16",
]
tensorrt = [
    "onnxruntime-gpu>=1.16",
    "tensorrt>=8.6",
]
streaming = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12.0",
]
carla = [
    "carla>=0.9.15",
]

[project.scripts]
aps-run = "src.app:main"
aps-evaluate = "scripts.evaluate:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
