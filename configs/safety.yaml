ttc:
  warning_s: 3.0
  critical_s: 1.5
risk:
  velocity_weight: 0.7
  distance_weight: 0.3
  escalation_threshold: 0.6
warnings:
  debounce_frames: 3
  persist_frames: 5
degraded_mode:
  enable: true
  drop_modules: [depth, segmentation]

# Phase 3.1: Occupancy grid
occupancy_grid:
  enabled: false
  resolution_m: 0.2
  max_range_m: 40.0

# Phase 3.2: Blind spot detection / RCTA
bsd:
  enabled: false
  blind_spot_x_range: [1.5, 4.0]
  ttc_warn_s: 3.0

# Phase 4: ISO 26262 Safety Architecture
asil:
  enabled: true

plausibility:
  enabled: false
  max_velocity_kmh: 200.0
  max_position_jump_m: 10.0
  max_bbox_overlap: 0.8
  max_detection_count: 100

redundant_detection:
  enabled: false
  iou_threshold: 0.5
  min_agreement: 0.6
  secondary_model: "yolov8s.pt"

dtc:
  enabled: false
  output_dir: "results"

# Round 2: Sensor health monitoring
sensor_health:
  enabled: false
  brightness_range: [40, 220]
  blur_threshold: 100.0
  expected_lidar_points: 10000
  health_threshold: 0.5
